{% extends "drill_base.html" %}
{% block title %}口算训练 - Math Tutor{% endblock %}

{% block keyboard %}
<div class="kb-grid">
    <button type="button" class="kb-key" data-ins="7">7</button>
    <button type="button" class="kb-key" data-ins="8">8</button>
    <button type="button" class="kb-key" data-ins="9">9</button>
    <button type="button" class="kb-key kb-action" data-act="backspace">⌫</button>

    <button type="button" class="kb-key" data-ins="4">4</button>
    <button type="button" class="kb-key" data-ins="5">5</button>
    <button type="button" class="kb-key" data-ins="6">6</button>
    <button type="button" class="kb-key kb-action" data-act="clear">清空</button>

    <button type="button" class="kb-key" data-ins="1">1</button>
    <button type="button" class="kb-key" data-ins="2">2</button>
    <button type="button" class="kb-key" data-ins="3">3</button>
    <button type="button" class="kb-key" data-ins="−">−</button>

    <button type="button" class="kb-key" data-ins="0">0</button>
    <button type="button" class="kb-key" data-ins=".">.</button>
    <button type="button" class="kb-key" data-ins="/">/</button>
    <button type="button" class="kb-key" data-ins="+">+</button>
</div>
{% endblock %}
