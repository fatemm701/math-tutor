<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整式化简练习 · 老师看板</title>
    <!-- 首帧前恢复夜间模式，避免先白后黑地闪一下 -->
    <script>
        try {
            if (localStorage.getItem('poly-theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) { }
    </script>
    <!-- 本地 KaTeX：题目和答案按数学格式显示，断网也能用 -->
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <script src="vendor/katex/katex.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F9FAFB;
            --surface: #fff;
            --line: #E5E7EB;
            --text: #111827;
            --text-muted: #4B5563;
            --text-faint: #9CA3AF;
            --text-head: #6B7280;
            --row-hover: #F9FAFB;
            --soft-btn-bg: #EEF2FF;
            --denied-text: #6B7280;
            --danger: #EF4444;
            --ok: #047857;
            --tag-correct-bg: #ECFDF5; --tag-correct-fg: #047857;
            --tag-wrong-bg: #FEF2F2;   --tag-wrong-fg: #B91C1C;
            --tag-hinted-bg: #FFFBEB;  --tag-hinted-fg: #B45309;
            --tag-revealed-bg: #EEF2FF; --tag-revealed-fg: #4338CA;
            --tag-fraction-bg: #F5F3FF; --tag-fraction-fg: #6D28D9;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
        }

        /* 夜间模式：深灰底，和练习页同一套色值 */
        html[data-theme="dark"] {
            --primary: #818CF8;
            --bg: #1E1E2E;
            --surface: #2A2A3C;
            --line: #3F3F58;
            --text: #E5E7EB;
            --text-muted: #A6ABC0;
            --text-faint: #8B90A3;
            --text-head: #9AA0B5;
            --row-hover: #30304A;
            --soft-btn-bg: #383560;
            --denied-text: #A6ABC0;
            --danger: #F87171;
            --ok: #34D399;
            --tag-correct-bg: #123528; --tag-correct-fg: #5EEAD4;
            --tag-wrong-bg: #3A1F22;   --tag-wrong-fg: #FCA5A5;
            --tag-hinted-bg: #3A3218;  --tag-hinted-fg: #F5D48B;
            --tag-revealed-bg: #3A3560; --tag-revealed-fg: #C4BCFF;
            --tag-fraction-bg: #3A2E52; --tag-fraction-fg: #D8B4FE;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.45);
            color-scheme: dark;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }

        .topbar {
            width: 100%;
            max-width: 1080px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .topbar .who {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .topbar button,
        .topbar a.btn {
            font-family: inherit;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            text-decoration: none;
        }

        .topbar a.btn.primary {
            color: #fff;
            background: var(--primary);
            border-color: var(--primary);
        }

        .wrap {
            width: 100%;
            max-width: 1080px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 顶部汇总卡片 */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
            gap: 10px;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
        }

        .card .k {
            font-size: 0.75rem;
            color: var(--text-head);
        }

        .card .v {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .panel {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .section-head h2 {
            font-size: 1rem;
            margin: 0;
        }

        .hint {
            font-size: 0.78rem;
            color: var(--text-faint);
        }

        /* 表格 */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th,
        td {
            padding: 8px 10px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid var(--line);
        }

        thead th {
            color: var(--text-head);
            font-weight: normal;
            font-size: 0.75rem;
        }

        tbody tr.clickable {
            cursor: pointer;
        }

        tbody tr.clickable:hover {
            background: var(--row-hover);
        }

        td.num,
        th.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        td.name {
            font-weight: bold;
        }

        .lv-head {
            font-size: 0.72rem;
            color: var(--text-faint);
            font-weight: normal;
        }

        button.mini {
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--primary);
            background: var(--soft-btn-bg);
            border: none;
            border-radius: 6px;
            padding: 3px 9px;
            cursor: pointer;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.74rem;
        }

        .tag-correct { background: var(--tag-correct-bg); color: var(--tag-correct-fg); }
        .tag-wrong { background: var(--tag-wrong-bg); color: var(--tag-wrong-fg); }
        .tag-hinted { background: var(--tag-hinted-bg); color: var(--tag-hinted-fg); }
        .tag-partial { background: var(--tag-hinted-bg); color: var(--tag-hinted-fg); }
        .tag-revealed { background: var(--tag-revealed-bg); color: var(--tag-revealed-fg); }
        .tag-fraction { background: var(--tag-fraction-bg); color: var(--tag-fraction-fg); margin-left: 6px; }

        /* 筛选条 */
        .filter-bar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0 0 14px;
            padding: 12px 14px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-line);
            border-radius: 10px;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-label {
            flex: 0 0 40px;
            font-size: 0.78rem;
            color: var(--text-head);
        }

        .chip {
            padding: 3px 10px;
            font-family: inherit;
            font-size: 0.78rem;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
        }

        .chip:hover { border-color: var(--primary); }

        .chip.on {
            color: #fff;
            background: var(--primary);
            border-color: var(--primary);
        }

        .filter-summary {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 0 0 12px;
            font-size: 0.8rem;
            color: var(--text-head);
        }

        .filter-summary strong { color: var(--text); font-weight: 600; }

        .empty {
            margin: 0;
            padding: 20px 0;
            text-align: center;
            color: var(--text-faint);
            font-size: 0.85rem;
        }

        /* 添加学生 */
        .add-box {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--line);
        }

        .add-box h3 {
            font-size: 0.9rem;
            margin: 0 0 8px;
            color: var(--text-muted);
        }

        .add-form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .add-form input {
            flex: 1 1 180px;
            min-width: 140px;
            padding: 8px 10px;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }

        .add-form input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .add-form button {
            flex: 0 0 auto;
            padding: 8px 18px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .add-form button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .msg {
            margin: 8px 0 0;
            min-height: 18px;
            font-size: 0.82rem;
            color: var(--danger);
        }

        .msg.ok {
            color: var(--ok);
        }

        /* 明细视图 */
        .detail-head {
            align-items: center;
        }

        /* 老师自己的记录 */
        .self-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .self-stats {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .link-btn {
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        /* 学生误入：只有老师能看 */
        .denied {
            background: var(--surface);
            border-radius: 12px;
            padding: 28px 20px;
            text-align: center;
            color: var(--denied-text);
            font-size: 0.9rem;
            line-height: 1.9;
        }

        .denied a {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <span class="who" id="who">加载中…</span>
        <span class="actions">
            <a class="btn primary" href="practice.html">去练习</a>
            <button type="button" id="theme-toggle" title="夜间模式" aria-pressed="false">🌙</button>
            <button type="button" id="refresh">刷新</button>
            <button type="button" id="logout">退出</button>
        </span>
    </div>

    <div class="wrap">
        <div class="cards" id="summary"></div>

        <div class="denied" id="denied" hidden>
            当前账号是学生，看板只有老师能打开。<br>
            <a href="practice.html">去练习 →</a>
        </div>

        <section class="panel" id="self-view" hidden>
            <div class="section-head">
                <h2>我自己</h2>
                <span class="hint">老师账号的练习记录，不计入学生统计</span>
            </div>
            <div class="self-line">
                <span class="self-stats" id="self-stats"></span>
                <button type="button" class="mini" id="self-detail">看明细</button>
            </div>
        </section>

        <section class="panel" id="list-view">
            <div class="section-head">
                <h2>学生</h2>
                <span class="hint" id="updated"></span>
            </div>
            <div class="filter-bar" id="list-filter"></div>
            <p class="filter-summary" id="list-filter-summary"></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>学生</th>
                            <th class="num">记录</th>
                            <th class="num">正确率</th>
                            <th class="num">错</th>
                            <th class="num">提示</th>
                            <th class="num">看解析</th>
                            <th class="num">平均用时</th>
                            <th class="num">最近</th>
                            <th class="num lv-head">① 入门</th>
                            <th class="num lv-head">② 基础</th>
                            <th class="num lv-head">③ 进阶</th>
                            <th class="num lv-head">④ 挑战</th>
                            <th class="num">分数题</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="students-body"></tbody>
                </table>
            </div>
            <p class="empty" id="list-empty" hidden></p>

            <div class="add-box">
                <h3>添加学生</h3>
                <form class="add-form" id="add-form">
                    <input id="add-name" type="text" maxlength="20" placeholder="学生姓名" required autocomplete="off">
                    <input id="add-pass" type="password" maxlength="64" placeholder="初始密码（至少 6 位）" required
                        autocomplete="new-password">
                    <button type="submit" id="add-btn">添加</button>
                </form>
                <p class="msg" id="add-msg"></p>
            </div>
        </section>

        <section class="panel" id="detail-view" hidden>
            <div class="section-head detail-head">
                <button type="button" class="link-btn" id="back">← 返回列表</button>
                <h2 id="detail-title">做题记录</h2>
            </div>
            <p class="hint" id="detail-msg"></p>
            <div class="filter-bar" id="detail-filter"></div>
            <p class="filter-summary" id="detail-filter-summary"></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>难度</th>
                            <th>题目</th>
                            <th>学生答案</th>
                            <th>正确答案</th>
                            <th>结果</th>
                            <th class="num">用时</th>
                        </tr>
                    </thead>
                    <tbody id="detail-body"></tbody>
                </table>
            </div>
            <p class="empty" id="detail-empty" hidden>这个学生还没有做题记录。</p>
        </section>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const LEVEL_LABEL = { 1: '① 入门', 2: '② 基础', 3: '③ 进阶', 4: '④ 挑战' };

        let currentUser = null;
        let students = [];

        // ---------- 小工具 ----------
        async function api(path, options) {
            const res = await fetch(path, Object.assign({ credentials: 'same-origin' }, options || {}));
            if (res.status === 401) {
                location.replace('index.html');
                throw new Error('请先登录');
            }
            let json = null;
            try { json = await res.json(); } catch (e) { json = null; }
            if (!res.ok || !json || !json.success) {
                throw new Error((json && json.msg) || ('请求失败（HTTP ' + res.status + '）'));
            }
            return json.data;
        }

        // KaTeX 不可用时退化成纯文本，保证表里总能看清题目
        function renderMath(el, text) {
            const value = (text === null || text === undefined) ? '' : String(text);
            el.textContent = value;
            if (typeof katex === 'undefined') return;
            try {
                katex.render(value, el, { displayMode: false, throwOnError: false });
            } catch (err) {
                el.textContent = value;
            }
        }

        function pad2(n) { return String(n).padStart(2, '0'); }

        function fmtMs(ms) {
            if (!ms) return '—';
            const total = Math.round(ms / 1000);
            if (total < 60) return total + ' 秒';
            const m = Math.floor(total / 60);
            const s = total % 60;
            return s ? m + ' 分 ' + s + ' 秒' : m + ' 分';
        }

        function fmtTime(ts) {
            if (!ts) return '—';
            const d = new Date(ts);
            const now = new Date();
            const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
            const sameDay = d.getFullYear() === now.getFullYear()
                && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
            if (sameDay) return '今天 ' + hm;
            return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + hm;
        }

        function fmtPct(v) { return (v === null || v === undefined) ? '—' : v + '%'; }

        function td(tr, text, className) {
            const cell = document.createElement('td');
            cell.textContent = (text === null || text === undefined) ? '' : String(text);
            if (className) cell.className = className;
            tr.appendChild(cell);
            return cell;
        }

        function tdMath(tr, text, className) {
            const cell = document.createElement('td');
            if (className) cell.className = className;
            renderMath(cell, text === '' || text === null || text === undefined ? '（空）' : text);
            tr.appendChild(cell);
            return cell;
        }

        // ---------- 计分口径（与 backend/routes/teacher.js 的 classify 保持一致）----------
        // 算对：独立对、提示后对；算错：提示后错、没去括号、没合并同类项、格式错、看解析
        const RESULT_OPTIONS = [
            { key: '', text: '全部' },
            { key: 'correct', text: '独立对' },
            { key: 'hintedCorrect', text: '提示后对' },
            { key: 'hintedWrong', text: '提示后错' },
            { key: 'wrong', text: '错' },
            { key: 'unmerged', text: '没化简完' },
            { key: 'error', text: '格式错' },
            { key: 'revealed', text: '看解析' }
        ];
        const CORRECT_KEYS = ['correct', 'hintedCorrect'];
        const PARTIAL_RESULTS = ['parentheses', 'unmerged', 'partial'];

        function isFraction(attempt) {
            return Array.isArray(attempt.tags) && attempt.tags.includes('fraction');
        }

        // 旧记录没有 gaveUp：只能靠「看到了完整解析且没做对」近似判定
        function gaveUpOf(attempt) {
            if (typeof attempt.gaveUp === 'boolean') return attempt.gaveUp;
            return attempt.revealed === true && attempt.result !== 'correct';
        }

        function classify(attempt) {
            if (gaveUpOf(attempt)) return 'revealed';
            if (attempt.usedHint) return attempt.result === 'correct' ? 'hintedCorrect' : 'hintedWrong';
            if (attempt.result === 'correct') return 'correct';
            if (PARTIAL_RESULTS.includes(attempt.result)) return 'unmerged';
            if (attempt.result === 'error') return 'error';
            return 'wrong';
        }

        const BUCKET_LABEL = {
            correct: '独立对',
            hintedCorrect: '提示后对',
            hintedWrong: '提示后错',
            wrong: '错',
            unmerged: '没化简完',
            error: '格式错',
            revealed: '看解析'
        };
        const BUCKETS = Object.keys(BUCKET_LABEL);

        // 明细里「没化简完」按原始 result 再细分，老师能一眼看出是哪种
        function bucketOf(attempt) {
            const key = classify(attempt);
            if (key === 'unmerged') {
                return attempt.result === 'parentheses'
                    ? { key, text: '没去括号', cls: 'tag-partial' }
                    : { key, text: '没合并同类项', cls: 'tag-partial' };
            }
            const cls = key === 'correct' ? 'tag-correct'
                : key === 'revealed' ? 'tag-revealed'
                    : (key === 'wrong' ? 'tag-wrong' : 'tag-hinted');
            return { key, text: BUCKET_LABEL[key], cls };
        }

        // ---------- 筛选 ----------
        const LEVEL_OPTIONS = [
            { key: '', text: '全部' },
            { key: '1', text: '① 入门' },
            { key: '2', text: '② 基础' },
            { key: '3', text: '③ 进阶' },
            { key: '4', text: '④ 挑战' }
        ];
        const KIND_OPTIONS = [
            { key: 'all', text: '全部' },
            { key: 'fraction', text: '分数题' },
            { key: 'integer', text: '整数题' }
        ];
        const RANGE_OPTIONS = [
            { key: 'all', text: '全部' },
            { key: 'week', text: '最近 7 天' },
            { key: 'today', text: '今天' }
        ];

        function emptyFilter() { return { result: '', level: '', kind: '', range: 'all' }; }
        function isFilterActive(f) {
            return !!(f.result || f.level || f.kind || (f.range && f.range !== 'all'));
        }

        // 列表页：用后端预先数好的稀疏计数求和，不拉明细
        function countsOfFilter(filter, allCounts) {
            const totals = { total: 0 };
            BUCKETS.forEach(b => { totals[b] = 0; });
            if (!allCounts) return totals;
            // 只按非默认值过滤，免得「全部」这两个字被当成一个桶名
            const active = (v) => (v !== '' && v !== undefined && v !== null && v !== 'all') ? v : null;
            const range = allCounts[active(filter.range) || 'all'] || {};
            const buckets = active(filter.result) ? [active(filter.result)] : BUCKETS;
            const levels = active(filter.level) ? [Number(filter.level)] : [1, 2, 3, 4];
            const kind = active(filter.kind);
            buckets.forEach(b => {
                const byLevel = range[b];
                if (!byLevel) return;
                levels.forEach(level => {
                    const cell = byLevel[String(level)] || byLevel[level];
                    if (!cell) return;
                    let n = 0;
                    if (!kind) n = (cell.fraction || 0) + (cell.integer || 0);
                    else n = cell[kind] || 0;
                    totals[b] += n;
                    totals.total += n;
                });
            });
            return totals;
        }

        // 明细页：内存里按原始字段过滤
        function filterAttempts(list, filter) {
            return (list || []).filter(a => {
                if (filter.result && classify(a) !== filter.result) return false;
                const levelStr = a.level === null || a.level === undefined ? '' : String(a.level);
                if (filter.level && levelStr !== String(filter.level)) return false;
                if (filter.kind === 'fraction' && !isFraction(a)) return false;
                if (filter.kind === 'integer' && isFraction(a)) return false;
                if (filter.range && filter.range !== 'all') {
                    const span = filter.range === 'today' ? 0 : 7 * 24 * 60 * 60 * 1000;
                    const floor = filter.range === 'today' ? startOfToday() : (Date.now() - span);
                    if ((a.createdAt || 0) < floor) return false;
                }
                return true;
            });
        }

        function startOfToday() {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        }

        // 一组 chip：点同一项等于取消，回到「全部」
        function renderFilterBar(box, filter, onChange) {
            box.innerHTML = '';
            const rows = [
                { label: '结果', options: RESULT_OPTIONS, field: 'result' },
                { label: '难度', options: LEVEL_OPTIONS, field: 'level' },
                { label: '题型', options: KIND_OPTIONS, field: 'kind' },
                { label: '时间', options: RANGE_OPTIONS, field: 'range' }
            ];
            rows.forEach(row => {
                const line = document.createElement('div');
                line.className = 'filter-row';
                const label = document.createElement('span');
                label.className = 'filter-label';
                label.textContent = row.label;
                line.appendChild(label);

                row.options.forEach(opt => {
                    const active = filter[row.field] === opt.key;
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'chip' + (active ? ' on' : '');
                    chip.dataset.field = row.field;
                    chip.dataset.value = opt.key;
                    chip.setAttribute('data-field', row.field);
                    chip.setAttribute('data-value', opt.key);
                    chip.textContent = opt.text;
                    chip.addEventListener('click', () => {
                        if (row.field === 'range') {
                            filter.range = opt.key || 'all';
                        } else {
                            filter[row.field] = (filter[row.field] === opt.key) ? '' : opt.key;
                        }
                        onChange();
                    });
                    line.appendChild(chip);
                });
                box.appendChild(line);
            });
        }

        function filterSummaryText(shown, total) {
            return '筛选后 ' + shown + ' 条 / 全部 ' + total + ' 条';
        }

        // 「筛选结果：独立对 3 · 提示后对 1 · …」：只列非零的类别
        function distributionText(totals) {
            const parts = BUCKETS
                .filter(b => totals[b] > 0)
                .map(b => BUCKET_LABEL[b] + ' ' + totals[b]);
            return parts.length ? '其中 ' + parts.join(' · ') : '没有符合条件的记录';
        }

        // ---------- 渲染 ----------
        // totals 来自 countsOfFilter（筛选后的各桶条数）；avgMs 传筛选后学生的用时加权平均，
        // 筛选把时间范围缩小后平均用时并不精确，所以这里只在「全部时间 + 没有其它筛选」时显示，否则给 —
        function renderSummary(totals, studentCount, avgMs) {
            const cards = $('summary');
            cards.innerHTML = '';
            const correctCount = CORRECT_KEYS.reduce((n, k) => n + (totals[k] || 0), 0);
            const accuracy = totals.total ? Math.round((correctCount / totals.total) * 1000) / 10 : null;
            const hinted = (totals.hintedCorrect || 0) + (totals.hintedWrong || 0);
            const items = [
                { k: '学生', v: studentCount + ' 人' },
                { k: '记录数', v: totals.total + ' 条' },
                { k: '正确率（提示算对，看解析算错）', v: fmtPct(accuracy) },
                { k: '独立做对', v: (totals.correct || 0) + ' 题', title: '没用提示、一次做对' },
                { k: '提示后对', v: (totals.hintedCorrect || 0) + ' 题', title: '点过提示但做对了，算正确' },
                { k: '错误', v: wrongOf(totals) + ' 题', title: '提示后错、没化简完、格式错、错 共 ' + wrongOf(totals) + ' 题' },
                { k: '用过提示', v: hinted + ' 题' },
                { k: '看解析', v: (totals.revealed || 0) + ' 题' },
                { k: '分数题（对/总）', v: fracText(totals) },
                { k: '平均用时', v: avgMs }
            ];
            items.forEach(item => {
                const box = document.createElement('div');
                box.className = 'card';
                const k = document.createElement('div');
                k.className = 'k';
                k.textContent = item.k;
                const v = document.createElement('div');
                v.className = 'v';
                v.textContent = item.v;
                box.appendChild(k);
                box.appendChild(v);
                cards.appendChild(box);
            });
        }

        function wrongOf(totals) {
            return (totals.hintedWrong || 0) + (totals.unmerged || 0) + (totals.error || 0) + (totals.wrong || 0);
        }

        // 「分数题（对/总）」：分母是分数题总数，分子按当前筛选下的算对口径
        function fracText(totals) {
            const total = (totals.totalFraction || 0);
            if (!total) return '—';
            return (totals.correctFraction || 0) + '/' + total;
        }

        // ---------- 列表页 ----------
        const listFilter = emptyFilter();

        // 把每个学生的 counts 按当前筛选条件求和
        function listTotals() {
            const totals = { total: 0 };
            BUCKETS.forEach(b => { totals[b] = 0; });
            totals.totalFraction = 0;
            totals.correctFraction = 0;
            totals.all = students.reduce((n, item) => n + (item.stats.total || 0), 0);
            students.forEach(item => {
                const c = countsOfFilter(listFilter, item.counts);
                BUCKETS.forEach(b => { totals[b] += c[b]; });
                totals.total += c.total;
                if (!listFilter.kind || listFilter.kind === 'all' || listFilter.kind === 'fraction') {
                    // 分数题卡片：筛选结果里的分数题数量（题型选了「整数题」时不显示分数题）
                    const frac = countsOfFilter(Object.assign({}, listFilter, { kind: 'fraction' }), item.counts);
                    totals.totalFraction += frac.total;
                    totals.correctFraction += CORRECT_KEYS.reduce((n, k) => n + frac[k], 0);
                }
            });
            return totals;
        }

        function refreshListSummary() {
            const totals = listTotals();
            renderSummary(totals, students.length, listAvgMs());
            $('list-filter-summary').textContent = filterSummaryText(totals.total, totals.all)
                + ' · ' + distributionText(totals);
        }

        // 平均用时：只有「时间=全部」且没有其它筛选时才等于全量平均，否则 —（后端没按时间分桶存用时）
        function listAvgMs() {
            const noFilter = !listFilter.result && !listFilter.level && !listFilter.kind
                && (!listFilter.range || listFilter.range === 'all');
            if (!noFilter) return '—';
            let ms = 0;
            let total = 0;
            students.forEach(item => {
                ms += (item.stats.avgMs || 0) * item.stats.total;
                total += item.stats.total;
            });
            return total ? fmtMs(Math.round(ms / total)) : '—';
        }

        function renderStudents() {
            const body = $('students-body');
            body.innerHTML = '';
            students.forEach(item => {
                const st = item.stats;
                const stFrac = st.fraction || {};
                const tr = document.createElement('tr');
                tr.className = 'clickable';
                tr.addEventListener('click', () => openDetail(item.user));

                td(tr, item.user.name, 'name');
                td(tr, st.total, 'num');
                const accCell = td(tr, fmtPct(st.accuracy), 'num');
                accCell.title = '算对 ' + (st.correctCount || 0) + ' / 共 ' + (st.total || 0)
                    + '（提示后做对算对，看解析算错）';
                td(tr, wrongOf(st), 'num');
                td(tr, st.hinted, 'num');
                td(tr, st.revealed, 'num');
                td(tr, fmtMs(st.avgMs), 'num');
                td(tr, fmtTime(st.lastAt), 'num');

                // 每档显示「独立做对 / 做过」，鼠标悬停看正确率和平均用时
                (st.byLevel || []).forEach(row => {
                    const cell = td(tr, row.total ? row.correct + '/' + row.total : '—', 'num');
                    if (row.total) {
                        cell.title = LEVEL_LABEL[row.level] + '：正确率 ' + fmtPct(row.accuracy)
                            + '，平均 ' + fmtMs(row.avgMs);
                    } else {
                        cell.title = LEVEL_LABEL[row.level] + '：还没做过';
                    }
                });

                const frac = st.fraction || {};
                const fracCorrect = CORRECT_KEYS.reduce((n, k) => n + (frac[k] || 0), 0);
                const fracCell = td(tr, frac.total ? fracCorrect + '/' + frac.total : '—', 'num');
                fracCell.title = frac.total
                    ? '分数题：正确率 ' + fmtPct(frac.accuracy) + '，平均 ' + fmtMs(frac.avgMs)
                    : '分数题：还没做过';

                const opCell = td(tr, '', 'num');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'mini';
                btn.textContent = '明细';
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDetail(item.user);
                });
                opCell.appendChild(btn);

                body.appendChild(tr);
            });

            const empty = $('list-empty');
            empty.hidden = students.length > 0;
            if (!students.length) {
                const invite = currentUser && currentUser.inviteCode ? currentUser.inviteCode : '';
                empty.textContent = invite
                    ? '还没有学生。把邀请码 ' + invite + ' 发给学生，或用下面表单直接添加。'
                    : '还没有学生。用下面表单直接添加，或让学生注册时填写你的邀请码。';
            }

            renderFilterBar($('list-filter'), listFilter, onListFilterChange);
            refreshListSummary();
        }

        function onListFilterChange() {
            renderFilterBar($('list-filter'), listFilter, onListFilterChange);
            refreshListSummary();
        }

        function renderAttempts(list) {
            const shown = filterAttempts(list, detailFilter);
            const body = $('detail-body');
            body.innerHTML = '';
            shown.forEach(a => {
                const tr = document.createElement('tr');
                td(tr, fmtTime(a.createdAt), 'num');
                const levelCell = td(tr, LEVEL_LABEL[a.level] || String(a.level));
                if (isFraction(a)) {
                    const ftag = document.createElement('span');
                    ftag.className = 'tag tag-fraction';
                    ftag.textContent = '分数';
                    levelCell.appendChild(ftag);
                }
                tdMath(tr, a.question);
                tdMath(tr, a.studentAnswer);
                tdMath(tr, a.answer);

                const resultCell = td(tr, '');
                const info = bucketOf(a);
                const tag = document.createElement('span');
                tag.className = 'tag ' + info.cls;
                tag.textContent = info.text;
                resultCell.appendChild(tag);

                td(tr, fmtMs(a.ms), 'num');
                body.appendChild(tr);
            });

            const totals = { total: 0 };
            BUCKETS.forEach(b => { totals[b] = 0; });
            shown.forEach(a => { totals[classify(a)]++; totals.total++; });
            $('detail-filter-summary').textContent = list.length
                ? filterSummaryText(shown.length, list.length) + ' · ' + distributionText(totals)
                : '';
            $('detail-empty').hidden = shown.length > 0;
            $('detail-empty').textContent = list.length
                ? '没有符合筛选条件的记录。'
                : '这个学生还没有做题记录。';
        }

        function refreshDetailFilter() {
            renderFilterBar($('detail-filter'), detailFilter, () => renderAttempts(detailList));
            renderAttempts(detailList);
        }

        // ---------- 数据 ----------
        let detailUser = null;
        let detailSource = 'student';
        let detailList = [];
        let selfInfo = null;
        const detailFilter = emptyFilter();

        // 老师自己（本账号）的练习记录：单独一块，不进学生统计
        function renderSelf(self) {
            selfInfo = self || null;
            const box = $('self-view');
            if (!selfInfo) {
                box.hidden = true;
                return;
            }
            const st = selfInfo.stats;
            $('self-stats').textContent = '练了 ' + st.total + ' 题 · 独立做对 ' + st.correct
                + ' · 提示后对 ' + (st.hintedCorrect || 0)
                + ' · 错误 ' + wrongOf(st) + ' · 提示 ' + st.hinted + ' · 看解析 ' + st.revealed
                + ' · 正确率 ' + fmtPct(st.accuracy) + ' · 平均用时 ' + fmtMs(st.avgMs);
            box.hidden = false;
        }

        async function load() {
            const data = await api('/api/teacher/students');
            students = data.students || [];
            students.sort((a, b) => {
                const la = a.stats.lastAt || 0;
                const lb = b.stats.lastAt || 0;
                if (la !== lb) return lb - la;                       // 最近做过的排前面
                return a.user.name.localeCompare(b.user.name, 'zh');
            });
            $('updated').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
            renderStudents();
            refreshListSummary();
            renderSelf(data.self);
        }

        async function openDetail(user, source) {
            // 筛选条件跨学生保留，但换人看明细时清掉，免得以为「没记录」
            if (detailUser && detailUser.id !== user.id) Object.assign(detailFilter, emptyFilter());
            detailUser = user;
            detailSource = source === 'self' ? 'self' : 'student';
            $('list-view').hidden = true;
            $('self-view').hidden = true;
            $('detail-view').hidden = false;
            $('detail-title').textContent = user.name + ' 的做题记录';
            $('detail-body').innerHTML = '';
            $('detail-empty').hidden = true;
            $('detail-msg').textContent = '加载中…';
            detailList = [];
            renderFilterBar($('detail-filter'), detailFilter, refreshDetailFilter);

            // 老师自己的记录走 /api/attempts/mine，学生的走老师专属接口
            const url = detailSource === 'self'
                ? '/api/attempts/mine?limit=100'
                : '/api/teacher/attempts?studentId=' + encodeURIComponent(user.id) + '&limit=100';

            try {
                const data = await api(url);
                detailList = data.attempts || [];
                $('detail-msg').textContent = detailList.length
                    ? '最近 ' + detailList.length + ' 条，新的在上面（同一道题只记一次）'
                    : '';
                refreshDetailFilter();
            } catch (err) {
                $('detail-msg').textContent = '加载失败：' + err.message;
            }
        }

        function backToList() {
            $('detail-view').hidden = true;
            $('list-view').hidden = false;
            if (selfInfo) $('self-view').hidden = false;
        }

        // ---------- 夜间模式（和练习页共用 poly-theme 这个开关） ----------
        function readTheme() {
            try {
                return localStorage.getItem('poly-theme') === 'dark' ? 'dark' : 'light';
            } catch (e) {
                const attr = document.documentElement && document.documentElement.getAttribute
                    ? document.documentElement.getAttribute('data-theme') : null;
                return attr === 'dark' ? 'dark' : 'light';
            }
        }

        function applyTheme(theme, btn) {
            const dark = theme === 'dark';
            if (document.documentElement) {
                if (dark) document.documentElement.setAttribute('data-theme', 'dark');
                else document.documentElement.removeAttribute('data-theme');
            }
            if (btn) {
                btn.textContent = dark ? '☀️' : '🌙';
                btn.title = dark ? '白天模式' : '夜间模式';
                btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
            }
            try {
                localStorage.setItem('poly-theme', dark ? 'dark' : 'light');
            } catch (e) { /* 记不住就算了，本次会话内照样能切 */ }
        }

        // ---------- 事件 ----------
        $('theme-toggle').addEventListener('click', () => {
            applyTheme(readTheme() === 'dark' ? 'light' : 'dark', $('theme-toggle'));
        });
        applyTheme(readTheme(), $('theme-toggle'));

        $('back').addEventListener('click', backToList);

        $('self-detail').addEventListener('click', () => {
            if (selfInfo) openDetail(selfInfo.user, 'self');
        });

        $('refresh').addEventListener('click', async () => {
            const btn = $('refresh');
            btn.disabled = true;
            try {
                if (!$('detail-view').hidden && detailUser) {
                    await openDetail(detailUser, detailSource);
                } else {
                    await load();
                }
            } catch (err) {
                $('updated').textContent = '刷新失败：' + err.message;
            } finally {
                btn.disabled = false;
            }
        });

        $('logout').addEventListener('click', async () => {
            try {
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
            } catch (err) { /* 忽略，照样回登录页 */ }
            location.replace('index.html');
        });

        $('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = $('add-name').value.trim();
            const password = $('add-pass').value;
            const msg = $('add-msg');
            msg.className = 'msg';
            msg.textContent = '';

            if (!name) {
                msg.textContent = '请填写学生姓名';
                return;
            }
            if (password.length < 6) {
                msg.textContent = '密码至少 6 位';
                return;
            }

            const btn = $('add-btn');
            btn.disabled = true;
            try {
                const data = await api('/api/teacher/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password })
                });
                msg.className = 'msg ok';
                msg.textContent = '已添加 ' + (data.user ? data.user.name : name) + '，让他用这个名字和密码登录。';
                $('add-name').value = '';
                $('add-pass').value = '';
                await load();
            } catch (err) {
                msg.textContent = err.message;
            } finally {
                btn.disabled = false;
            }
        });

        // ---------- 启动：先确认是老师，再拉数据 ----------
        (async () => {
            try {
                const me = await api('/api/auth/me');
                const user = me && me.user;
                if (!user) {
                    location.replace('index.html');
                    return;
                }
                if (user.role !== 'teacher') {
                    $('who').textContent = '当前账号：学生 ' + user.name;
                    $('denied').hidden = false;
                    $('list-view').hidden = true;
                    return;
                }

                currentUser = user;
                $('who').textContent = '老师：' + user.name
                    + (user.inviteCode ? ' · 邀请码 ' + user.inviteCode : '');
                await load();
            } catch (err) {
                if (err && /请先登录/.test(err.message)) return;
                $('updated').textContent = '初始化失败：' + (err && err.message ? err.message : String(err));
            }
        })();
    </script>
</body>

</html>
