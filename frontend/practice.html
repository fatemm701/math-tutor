<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整式化简练习</title>
    <!-- 引入 KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- 引入 Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F9FAFB;
            --key-bg: #FFFFFF;
            --key-active: #E5E7EB;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 顶部：当前账号 + 退出 */
        .topbar {
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #4B5563;
        }

        .topbar .who {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .topbar a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        .topbar button {
            font-family: inherit;
            font-size: 0.8rem;
            color: #4B5563;
            background: #fff;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
        }

        /* 难度选择卡片 */
        .level-tabs {
            display: flex;
            gap: 8px;
        }

        .level-tab {
            flex: 1;
            padding: 10px 0;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            color: #4B5563;
            background: white;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .level-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .display-board {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-label {
            font-size: 0.9rem;
            color: #6B7280;
            margin-bottom: 10px;
        }

        .katex-display {
            margin: 0 !important;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .key {
            background: var(--key-bg);
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            padding: 15px 0;
            font-size: 1.25rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: background 0.1s;
        }

        .key:active {
            background: var(--key-active);
            transform: scale(0.98);
        }

        .key.action {
            background: #E5E7EB;
            font-size: 1rem;
        }

        .key.submit {
            background: var(--primary);
            color: white;
            border: none;
        }

        .key.submit:active {
            background: #4338CA;
        }

        .feedback {
            margin-top: 10px;
            font-size: 0.9rem;
            min-height: 20px;
            font-weight: bold;
        }

        /* 提示 / 分步解析面板 */
        .hint-panel,
        .steps-panel {
            margin-top: 12px;
            border-radius: 8px;
            padding: 10px 12px;
            text-align: left;
            font-size: 0.85rem;
            line-height: 1.7;
        }

        .hint-panel {
            background: #FFFBEB;
            border: 1px solid #FDE68A;
            color: #92400E;
        }

        .hint-panel ul {
            margin: 4px 0 0;
            padding-left: 18px;
        }

        .steps-panel {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
        }

        .panel-title {
            font-weight: bold;
            color: #475569;
            margin-bottom: 6px;
        }

        .step-row {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 2px 0;
        }

        .step-title {
            flex: 0 0 6.4em;
            color: #64748B;
            font-size: 0.78rem;
        }

        .step-body {
            flex: 1;
            overflow-x: auto;
            color: #0F172A;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <span class="who" id="who">加载中…</span>
        <span class="actions">
            <button type="button" id="logout">退出</button>
        </span>
    </div>

    <div class="container">
        <!-- 难度选择 -->
        <div class="level-tabs" id="level-tabs">
            <button class="level-tab" data-level="1">① 入门</button>
            <button class="level-tab" data-level="2">② 基础</button>
            <button class="level-tab" data-level="3">③ 进阶</button>
            <button class="level-tab" data-level="4">④ 挑战</button>
        </div>

        <div class="display-board">
            <div class="question-label" id="level-label">当前题目</div>
            <div id="question-display"></div>
            <div class="question-label" style="margin-top: 15px;">你的答案</div>
            <div id="input-display" style="color: var(--primary); min-height: 35px;"></div>
            <div id="feedback-display" class="feedback"></div>
            <div id="hint-display" class="hint-panel" hidden></div>
            <div id="steps-display" class="steps-panel" hidden></div>
        </div>

        <div class="keyboard" id="keyboard">
            <!-- 第一排 -->
            <div class="key" data-val="7">7</div>
            <div class="key" data-val="8">8</div>
            <div class="key" data-val="9">9</div>
            <div class="key" data-val="+">+</div>

            <!-- 第二排 -->
            <div class="key" data-val="4">4</div>
            <div class="key" data-val="5">5</div>
            <div class="key" data-val="6">6</div>
            <div class="key" data-val="-">-</div>

            <!-- 第三排 -->
            <div class="key" data-val="1">1</div>
            <div class="key" data-val="2">2</div>
            <div class="key" data-val="3">3</div>
            <div class="key" data-val="*">×</div>

            <!-- 第四排 -->
            <div class="key" data-val="0">0</div>
            <div class="key" data-val="x">x</div>
            <div class="key" data-val="(">(</div>
            <div class="key" data-val=")">)</div>

            <!-- 第五排 -->
            <div class="key" data-val="a">a</div>
            <div class="key" data-val="b">b</div>
            <div class="key" data-val="^2">²</div>
            <div class="key" data-val="^3">³</div>

            <!-- 第六排：退格、提示、看答案、提交 -->
            <div class="key action" data-action="backspace">退格</div>
            <div class="key action" data-action="hint">提示</div>
            <div class="key action" data-action="giveup" style="color: #EF4444;">看答案</div>
            <div class="key submit" data-action="submit">提交答案</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 本地数学引擎 (出题 + 判卷)
        // ==========================================
        function rand(min, max, excludeZero = true) {
            let val;
            do { val = Math.floor(Math.random() * (max - min + 1)) + min; }
            while (excludeZero && val === 0);
            return val;
        }

        // 乘数系数：排除 0 和 ±1 —— 1(x + 3) 没有练习价值，-1(x + 3) 本来就该写成 -(x + 3)
        // 这样题面不会出现 1(...) / -1(...) 这种难看的写法
        function randMul(min, max) {
            let val;
            do { val = rand(min, max); } while (Math.abs(val) === 1);
            return val;
        }

        function formatTerm(coef, variable) {
            if (coef === 0) return '0';
            if (variable === '') return `${coef}`;
            if (coef === 1) return variable;
            if (coef === -1) return `-${variable}`;
            return `${coef}${variable}`;
        }

        // mathjs 会把隐式乘号当成单位或函数调用（a=are、b=bit、x(3) 当函数调用），
        // 解析前先补全显式乘号：3ab -> 3*a*b，x( -> x*(，)( -> )*(
        function normalizeExpr(expr) {
            let s = String(expr).replace(/\s+/g, '');
            s = s.replace(/([a-zA-Z)])(?=[a-zA-Z(])/g, '$1*'); // ab -> a*b, x( -> x*(, )( -> )*(
            s = s.replace(/(\d)(?=[a-zA-Z(])/g, '$1*');        // 3a -> 3*a, 3( -> 3*(
            s = s.replace(/([a-zA-Z)])(?=\d)/g, '$1*');        // x2 -> x*2
            return s;
        }

        // 把表达式展开成「单项式 -> 系数」，用于精确判等和输出最简答案
        // （mathjs 的 rationalize/simplify 处理 a、b 这种多字母多项式时会漏合并）
        const VAR_ORDER = ['x', 'a', 'b'];

        function expandExpr(node) {
            if (node.isParenthesisNode) return expandExpr(node.content);
            if (node.isConstantNode) {
                const v = Number(node.value);
                if (!Number.isInteger(v)) throw new Error('系数必须是整数');
                return v === 0 ? new Map() : new Map([['0,0,0', v]]);
            }
            if (node.isSymbolNode) {
                const idx = VAR_ORDER.indexOf(node.name);
                if (idx < 0) throw new Error('不支持的字母');
                const exp = [0, 0, 0];
                exp[idx] = 1;
                return new Map([[exp.join(','), 1]]);
            }
            if (node.isOperatorNode) {
                if (node.op === 'unaryMinus' || (node.op === '-' && node.args.length === 1)) {
                    return polyScale(expandExpr(node.args[0]), -1);
                }
                if (node.op === '+' || node.op === '-') {
                    return polyAdd(expandExpr(node.args[0]), expandExpr(node.args[1]), node.op === '-' ? -1 : 1);
                }
                if (node.op === '*') {
                    return polyMul(expandExpr(node.args[0]), expandExpr(node.args[1]));
                }
                if (node.op === '^') {
                    const exp = node.args[1].isConstantNode ? Number(node.args[1].value) : NaN;
                    if (!Number.isInteger(exp) || exp < 0 || exp > 6) throw new Error('指数不合法');
                    const base = expandExpr(node.args[0]);
                    let result = new Map([['0,0,0', 1]]);
                    for (let i = 0; i < exp; i++) result = polyMul(result, base);
                    return result;
                }
            }
            throw new Error('表达式不支持');
        }

        function polyScale(poly, k) {
            const out = new Map();
            poly.forEach((c, key) => {
                if (c * k !== 0) out.set(key, c * k);
            });
            return out;
        }

        function polyAdd(a, b, sign) {
            const out = new Map(a);
            b.forEach((c, key) => {
                const v = (out.get(key) || 0) + sign * c;
                v === 0 ? out.delete(key) : out.set(key, v);
            });
            return out;
        }

        function polyMul(a, b) {
            const out = new Map();
            a.forEach((ca, ka) => {
                const ea = ka.split(',').map(Number);
                b.forEach((cb, kb) => {
                    const eb = kb.split(',').map(Number);
                    const key = ea.map((v, i) => v + eb[i]).join(',');
                    const v = (out.get(key) || 0) + ca * cb;
                    v === 0 ? out.delete(key) : out.set(key, v);
                });
            });
            return out;
        }

        function samePoly(a, b) {
            if (a.size !== b.size) return false;
            for (const [key, coef] of a) {
                if (b.get(key) !== coef) return false;
            }
            return true;
        }

        // 输出隐含乘号的写法：8ab - 2a + 3
        function formatPoly(poly) {
            const terms = [...poly.entries()].map(([key, coef]) => {
                const exp = key.split(',').map(Number);
                let varStr = '';
                exp.forEach((e, i) => {
                    if (e === 1) varStr += VAR_ORDER[i];
                    else if (e > 1) varStr += `${VAR_ORDER[i]}^${e}`;
                });
                return { coef, varStr, exp, degree: exp.reduce((s, v) => s + v, 0) };
            }).sort((p, q) => (q.degree - p.degree)
                || (q.exp[2] - p.exp[2]) || (q.exp[1] - p.exp[1]) || (q.exp[0] - p.exp[0]));

            if (terms.length === 0) return '0';
            return terms.map((t, i) => {
                const abs = Math.abs(t.coef);
                const body = t.varStr === '' ? `${abs}` : (abs === 1 ? t.varStr : `${abs}${t.varStr}`);
                if (i === 0) return t.coef < 0 ? `-${body}` : body;
                return `${t.coef < 0 ? ' - ' : ' + '}${body}`;
            }).join('');
        }

        function parseToPoly(expr) {
            return expandExpr(math.parse(normalizeExpr(expr)));
        }

        function maxExponent(poly) {
            let max = 0;
            poly.forEach((c, key) => {
                key.split(',').forEach(e => { max = Math.max(max, Number(e)); });
            });
            return max;
        }

        function genPoly(pool, num, minCoef, maxCoef) {
            const selectedTypes = [...pool].sort(() => 0.5 - Math.random()).slice(0, num);
            const terms = selectedTypes.map(type => formatTerm(rand(minCoef, maxCoef), type === 'const' ? '' : type));
            return terms.reduce((acc, term, idx) => {
                if (idx === 0) return term;
                return term.startsWith('-') ? `${acc} - ${term.slice(1)}` : `${acc} + ${term}`;
            }, "");
        }

        function buildTemplate(level) {
            if (level === 1) {
                const A = rand(-10, 10);
                const P1 = genPoly(['const', 'x'], 2, -5, 5);
                const type = rand(1, 4);
                if (type === 1) return `${A} - (${P1})`;
                if (type === 2) return `${A} + (${P1})`;
                if (type === 3) return `-(${P1}) + ${A}`;
                return `-(${P1})`;
            }
            else if (level === 2) {
                const k1 = randMul(-5, 5);
                const k2 = randMul(-5, 5);
                const P1 = genPoly(['const', 'x'], 2, -10, 10);
                const P2 = genPoly(['const', 'x'], 2, -10, 10);
                const mono = formatTerm(rand(-5, 5), 'x');
                const type = rand(1, 4);
                if (type === 1) return `${k1}(${P1}) - ${k2}(${P2})`;
                if (type === 2) return `${k1}(${P1}) - ${mono}`;
                if (type === 3) return `(${P1}) + ${k2}(${P2})`;
                return `(${P1}) - ${k2}(${P2})`;
            }
            else if (level === 3) {
                const k = randMul(-4, 4);
                const mono = formatTerm(rand(-4, 4), 'x');
                const P1 = genPoly(['const', 'x', 'x^2'], rand(2, 3), -6, 6);
                const P2 = genPoly(['const', 'x', 'x^2'], 2, -6, 6);
                const P3 = genPoly(['const', 'x'], 2, -4, 4);
                const type = rand(1, 4);
                if (type === 1) return `${mono} - ${k}(${P1} - (${P3}))`;
                if (type === 2) return `${k}(${P1}) - ${mono}`;
                if (type === 3) return `x(${P3}) - ${k}(${P2})`;
                return `${mono} - (${k}(${P3}) - ${rand(1, 9)})`;
            }
            else {
                const k1 = randMul(-4, 4);
                const k2 = randMul(-4, 4);
                const mono = formatTerm(rand(-4, 4), rand(1, 2) === 1 ? 'a' : 'b');
                const pool = ['const', 'a', 'b', 'ab', 'a^2', 'b^2'];
                const P1 = genPoly(pool, rand(2, 3), -5, 5);
                const P2 = genPoly(pool, 2, -5, 5);
                const type = rand(1, 4);
                if (type === 1) return `${mono} - ${k1}(${P1}) + ${formatTerm(k2, 'b')}`;
                if (type === 2) return `${k1}(${P1}) - ${k2}(${P2})`;
                if (type === 3) return `a(${genPoly(['a', 'b'], 2, -3, 3)}) - ${k2}(${P2})`;
                return `-(${P1}) + ${k2}(${P2})`;
            }
        }

        function generateQuestion(level = 1) {
            for (let i = 0; i < 500; i++) {
                const expr = buildTemplate(level);
                if (!expr.includes('(')) continue;
                let poly;
                try {
                    // 按显式乘号解析，避免 5a 被当成单位、3ab 被当成符号 "ab"
                    poly = parseToPoly(expr);
                } catch (e) { continue; }

                const ansStr = formatPoly(poly).replace(/\s/g, '');
                if (ansStr === '0' || normalizeExpr(expr) === ansStr) continue;
                if (poly.size < 2 || poly.size > 6) continue;
                if (maxExponent(poly) > 3) continue;

                return { level, question: expr, answer: ansStr };
            }
            return { level, question: '3 - (x + 3)', answer: '-x' };
        }

        function evaluateAnswer(studentAns, standardAns) {
            if (/[+\-*/]{2,}/.test(studentAns.replace(/\s/g, ''))) {
                return { status: 'error', msg: '含有连续符号，请写成最简形式' };
            }
            try {
                const stuPoly = parseToPoly(studentAns);
                const stdPoly = parseToPoly(standardAns);
                const isEquivalent = samePoly(stuPoly, stdPoly);
                const hasParentheses = /[()]/.test(studentAns);

                // 学生写的项数多于最简项数 -> 没有合并同类项
                const getTermCount = (e) => e.replace(/[\s*]/g, '').split(/(?=[+-])/).filter(t => t !== '').length;
                const stuTermCount = getTermCount(studentAns);
                const isMerged = stuTermCount <= stdPoly.size;

                if (isEquivalent && !hasParentheses && isMerged) return { status: 'correct', msg: '完全正确！' };
                if (isEquivalent && hasParentheses) return { status: 'partial', msg: '结果正确，但尚未去括号' };
                if (isEquivalent && !hasParentheses && !isMerged) return { status: 'partial', msg: '去括号正确，但未合并同类项' };
                return { status: 'wrong', msg: '答案错误，请再检查一下计算' };
            } catch (e) {
                return { status: 'error', msg: '表达式无法解析，请检查输入格式' };
            }
        }

        // ==========================================
        // 1b. 提示与分步解析
        // ==========================================
        // 题面 -> [ { coef, vars:[x,a,b 的指数], inner:[子项] | null } ]
        // 所有中间步骤都从这个结构渲染，保证每一步都与最终答案等价
        function addVars(a, b) {
            return a.map((v, i) => v + b[i]);
        }

        function varsToStr(vars) {
            let s = '';
            vars.forEach((e, i) => {
                if (e === 1) s += VAR_ORDER[i];
                else if (e > 1) s += `${VAR_ORDER[i]}^${e}`;
            });
            return s;
        }

        function itemBody(it) {              // 不含正负号
            const v = varsToStr(it.vars);
            const a = Math.abs(it.coef);
            if (v === '') return `${a}`;
            return a === 1 ? v : `${a}${v}`;
        }

        function renderSum(items) {
            if (items.length === 0) return '0';
            return items.map((it, i) => {
                let body = itemBody(it);
                if (it.inner) {
                    const v = varsToStr(it.vars);
                    const a = Math.abs(it.coef);
                    const pre = (a === 1 && v === '') ? '' : `${a}${v}`;
                    body = `${pre}(${renderSum(it.inner)})`;
                }
                if (i === 0) return it.coef < 0 ? `-${body}` : body;
                return it.coef < 0 ? ` - ${body}` : ` + ${body}`;
            }).join('');
        }

        // 单项式 × 一串项：系数/字母挂到括号外面，括号里的加减法留给后面展开
        function mulItem(x, list) {
            if (list.length === 1) {
                const y = list[0];
                return { coef: x.coef * y.coef, vars: addVars(x.vars, y.vars), inner: y.inner };
            }
            if (list.some(it => it.inner)) throw new Error('不支持的括号相乘');
            return { coef: x.coef, vars: x.vars, inner: list };
        }

        function nodeToItems(node) {
            if (node.isParenthesisNode) {
                // 括号里有加减法时，保留成"一个括号组"，后面才能按步展开
                const inner = nodeToItems(node.content);
                if (inner.length === 1 && !inner[0].inner) return inner;
                return [{ coef: 1, vars: [0, 0, 0], inner }];
            }

            if (node.isConstantNode) {
                const v = Number(node.value);
                if (!Number.isInteger(v)) throw new Error('系数必须是整数');
                return [{ coef: v, vars: [0, 0, 0], inner: null }];
            }

            if (node.isSymbolNode) {
                const idx = VAR_ORDER.indexOf(node.name);
                if (idx < 0) throw new Error('不支持的字母');
                const vars = [0, 0, 0];
                vars[idx] = 1;
                return [{ coef: 1, vars, inner: null }];
            }

            if (node.isOperatorNode) {
                if (node.args.length === 1) {
                    // 负号：把符号乘进括号里的每一项
                    return nodeToItems(node.args[0]).map(it => ({
                        coef: -it.coef, vars: it.vars.slice(), inner: it.inner
                    }));
                }
                if (node.op === '+' || node.op === '-') {
                    const left = nodeToItems(node.args[0]);
                    const right = nodeToItems(node.args[1]);
                    if (node.op === '+') return left.concat(right);
                    return left.concat(right.map(it => ({
                        coef: -it.coef, vars: it.vars.slice(), inner: it.inner
                    })));
                }
                if (node.op === '*') {
                    const a = nodeToItems(node.args[0]);
                    const b = nodeToItems(node.args[1]);
                    // 乘数 × 括号：把乘数的系数/字母挂到括号上，留到"乘进括号"那一步展开
                    if (a.length === 1 && !a[0].inner) return [mulItem(a[0], b)];
                    if (b.length === 1 && !b[0].inner) return [mulItem(b[0], a)];
                    throw new Error('不支持的乘法');
                }
                if (node.op === '^') {
                    const base = nodeToItems(node.args[0]);
                    const exp = node.args[1].isConstantNode ? Number(node.args[1].value) : NaN;
                    if (base.length !== 1 || !Number.isInteger(exp) || exp < 0 || exp > 6) {
                        throw new Error('不支持的乘方');
                    }
                    if (base[0].inner) throw new Error('不支持的括号乘方');
                    return [{
                        coef: Math.pow(base[0].coef, exp),
                        vars: base[0].vars.map(v => v * exp),
                        inner: null
                    }];
                }
            }

            throw new Error('表达式不支持');
        }

        // 括号内部：把「乘数 × 括号」的乘法算掉，内层括号随之消失、摊平到这一层
        function expandContent(items) {
            const out = [];
            items.forEach(it => {
                if (!it.inner) { out.push(it); return; }
                const content = expandContent(it.inner);
                const k = Math.abs(it.coef);
                const hasVars = it.vars.some(e => e !== 0);
                if (k === 1 && !hasVars) {
                    out.push({ coef: it.coef, vars: it.vars.slice(), inner: content });
                } else {
                    content.forEach(sub => out.push({
                        coef: it.coef * sub.coef,
                        vars: addVars(it.vars, sub.vars),
                        inner: sub.inner
                    }));
                }
            });
            return out;
        }

        // 把「乘数 × 括号」的乘数乘进去，但保留这一层括号；
        // 只有 -(x + 3) 这种纯变号的括号原样保留，交给「去括号」那一步
        function distributeOneLevel(items) {
            return items.map(it => {
                if (!it.inner) return it;
                const content = expandContent(it.inner);
                const k = Math.abs(it.coef);
                const hasVars = it.vars.some(e => e !== 0);
                if (k === 1 && !hasVars) {
                    return { coef: it.coef, vars: it.vars.slice(), inner: content };
                }
                const scaled = content.map(sub => ({
                    coef: sub.coef * k,
                    vars: addVars(it.vars, sub.vars),
                    inner: sub.inner
                }));
                return { coef: it.coef < 0 ? -1 : 1, vars: [0, 0, 0], inner: scaled };
            });
        }

        function combineItems(items) {
            const out = [];
            const index = new Map();
            items.forEach(it => {
                if (it.inner) { out.push(it); return; }   // 还带括号的先不合并
                const key = it.vars.join(',');
                const found = index.get(key);
                if (found) found.coef += it.coef;
                else {
                    const copy = { coef: it.coef, vars: it.vars.slice(), inner: null };
                    index.set(key, copy);
                    out.push(copy);
                }
            });
            return out.filter(it => it.coef !== 0);
        }

        function combineInside(items) {
            return items.map(it => it.inner
                ? { coef: it.coef, vars: it.vars.slice(), inner: combineItems(it.inner) }
                : it);
        }

        function flattenItems(items) {
            const out = [];
            items.forEach(it => {
                if (!it.inner) { out.push(it); return; }
                flattenItems(it.inner).forEach(sub => out.push({
                    coef: it.coef * sub.coef,
                    vars: addVars(it.vars, sub.vars),
                    inner: null
                }));
            });
            return out;
        }

        function normalizeForCompare(s) {
            return String(s).replace(/\s+/g, '');
        }

        // 原式 -> 乘进括号 -> 括号内合并 -> 去括号 -> 合并同类项
        function buildSteps(question, answer) {
            const steps = [];
            let items;
            try {
                items = nodeToItems(math.parse(normalizeExpr(question)));
            } catch (e) {
                return [{ title: '答案', expr: answer }];
            }

            const push = (title, expr) => {
                const last = steps[steps.length - 1];
                if (last && normalizeForCompare(last.expr) === normalizeForCompare(expr)) return;
                steps.push({ title, expr });
            };

            push('原式', question);

            const distributed = distributeOneLevel(items);
            push('乘进括号', renderSum(distributed));

            const combined = combineInside(distributed);
            push('括号内合并', renderSum(combined));

            const flat = flattenItems(combined);
            push('去括号', renderSum(flat));

            push('合并同类项', answer);

            if (steps.length < 2) steps.push({ title: '答案', expr: answer });
            if (normalizeForCompare(steps[steps.length - 1].expr) !== normalizeForCompare(answer)) {
                steps.push({ title: '合并同类项', expr: answer });
            }
            return steps;
        }

        // 按题面结构给提示（可同时命中多条）
        function hintsFor(question) {
            const hints = [];
            let items = null;
            try {
                items = nodeToItems(math.parse(normalizeExpr(question)));
            } catch (e) {
                items = null;
            }

            if (items) {
                let nested = false, negativeBracket = false, numberTimes = false, varTimes = false;
                const walk = (list) => list.forEach(it => {
                    if (!it.inner) return;
                    if (it.inner.some(sub => sub.inner)) nested = true;
                    if (it.coef < 0) negativeBracket = true;
                    if (Math.abs(it.coef) > 1) numberTimes = true;
                    if (it.vars.some(e => e !== 0)) varTimes = true;
                    walk(it.inner);
                });
                walk(items);

                if (nested) hints.push('括号里还套着括号，从最里面那一层开始去。');
                if (varTimes) hints.push('字母乘括号：把字母乘到括号里的每一项上，指数相同的才能合并。');
                if (negativeBracket) hints.push('括号前面是减号，去掉括号时里面每一项都要变号，别只改第一项。');
                if (numberTimes) hints.push('括号外面的数要乘到括号里的每一项，别漏乘最后一项。');
            }

            const q = String(question).replace(/\s+/g, '');
            if (/[ab]/.test(q)) hints.push('a 和 b 不是同类项；ab、a²、b² 也各算一类，别合并到一起。');
            else if (/\^2/.test(q)) hints.push('x 和 x² 不是同类项，要分开合并。');

            hints.push('先去括号（乘进括号、注意变号），最后再合并同类项。');
            return hints;
        }

        // ==========================================
        // 2. 前端交互与防作弊逻辑
        // ==========================================
        window.onload = async () => {
            const LEVELS = [1, 2, 3, 4];
            let STORAGE_KEY = "poly_current_q";

            let currentUser = null;
            let currentInput = "";
            let currentQ = null;
            let isLocked = false;   // 答对或看答案后锁定，禁止继续输入
            let nextTimer = null;   // 自动进入下一题的定时器（切难度时清掉，避免竞态跳题）
            let wrongCount = 0;     // 本题已经错了多少次（满 2 次放解析）
            let hintUsed = false;   // 本题是否已展开过提示

            const qEl = document.getElementById("question-display");
            const inEl = document.getElementById("input-display");
            const fbEl = document.getElementById("feedback-display");
            const hintsEl = document.getElementById("hint-display");
            const stepsEl = document.getElementById("steps-display");
            const levelTabs = document.getElementById("level-tabs");
            const submitKey = document.querySelector(".key.submit");

            // ---------- 账号 ----------
            async function fetchMe() {
                try {
                    const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
                    if (!res.ok) return null;
                    const json = await res.json();
                    return json && json.success ? json.data.user : null;
                } catch (err) {
                    return null;
                }
            }

            function rememberUser(user) {
                currentUser = user;
                STORAGE_KEY = 'poly_current_q:' + user.id;   // 同一浏览器换人登录不会串题
                const whoEl = document.getElementById('who');
                if (whoEl) {
                    const roleLabel = user.role === 'teacher' ? '老师' : '学生';
                    const invite = user.inviteCode ? ' · 邀请码 ' + user.inviteCode : '';
                    whoEl.textContent = roleLabel + '：' + user.name + invite;
                }
            }

            function makeClientId() {
                return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
            }

            // 一题结束时上报一次；失败只警告，绝不影响做题
            function reportAttempt(result, revealed, studentAnswer) {
                if (!currentUser || !currentQ || !currentQ.clientId) return;
                const payload = {
                    clientId: currentQ.clientId,
                    level: currentQ.level,
                    question: currentQ.question,
                    answer: currentQ.answer,
                    studentAnswer: studentAnswer || '',
                    result,
                    usedHint: hintUsed,
                    revealed: !!revealed,
                    ms: Math.max(0, Date.now() - (currentQ.startedAt || Date.now()))
                };
                fetch('/api/attempts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                }).then(res => {
                    if (res.ok) return null;
                    return res.json()
                        .catch(() => ({}))
                        .then(json => { throw new Error((json && json.msg) || ('HTTP ' + res.status)); });
                }).catch(err => {
                    console.warn('[poly-drill] 记录上报失败（不影响做题）：' + err.message);
                });
            }

            function isValidQuestion(q) {
                return !!q && typeof q.question === 'string' && typeof q.answer === 'string'
                    && LEVELS.includes(q.level);
            }

            // 加载题目：默认优先读取本地存货，刷新页面不丢当前题
            function loadQuestion(level = 2, forceNew = false) {
                if (nextTimer) { clearTimeout(nextTimer); nextTimer = null; }

                isLocked = false;
                currentInput = "";
                wrongCount = 0;
                hintUsed = false;
                fbEl.textContent = "";
                fbEl.style.color = "";
                resetPanels();
                setSubmitKey('submit', '提交答案');

                let saved = null;
                if (!forceNew) {
                    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
                    if (!isValidQuestion(saved)) saved = null;
                }

                if (saved) {
                    currentQ = saved;
                    if (!currentQ.startedAt) currentQ.startedAt = Date.now();
                    if (!currentQ.clientId) currentQ.clientId = makeClientId();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentQ));
                } else {
                    currentQ = generateQuestion(level);
                    currentQ.startedAt = Date.now();
                    currentQ.clientId = makeClientId();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentQ));
                }

                // 高亮当前难度
                document.querySelectorAll('.level-tab').forEach(tab => {
                    tab.classList.toggle('active', parseInt(tab.dataset.level) === currentQ.level);
                });

                katex.render(currentQ.question, qEl, { displayMode: true, throwOnError: false });
                renderInput();
            }

            function renderInput() {
                let displayStr = currentInput === "" ? "\\textcolor{#9CA3AF}{\\text{请点击下方键盘输入}}" : currentInput.replace(/\*/g, '\\cdot ');
                katex.render(displayStr, inEl, { displayMode: true, throwOnError: false });
            }

            function resetPanels() {
                hintsEl.innerHTML = "";
                stepsEl.innerHTML = "";
                hintsEl.hidden = true;
                stepsEl.hidden = true;
            }

            function setSubmitKey(action, label) {
                submitKey.dataset.action = action;
                submitKey.textContent = label;
            }

            // 提示：按题型给 1~3 句话，同一题只展开一次
            function showHints() {
                if (hintUsed) return;
                hintUsed = true;

                hintsEl.innerHTML = "";
                const title = document.createElement('div');
                title.className = 'panel-title';
                title.textContent = '提示';
                hintsEl.appendChild(title);

                const ul = document.createElement('ul');
                hintsFor(currentQ.question).forEach(text => {
                    const li = document.createElement('li');
                    li.textContent = text;
                    ul.appendChild(li);
                });
                hintsEl.appendChild(ul);
                hintsEl.hidden = false;
            }

            // 分步解析：每步都与标准答案等价，最后一步就是答案
            function showSteps() {
                stepsEl.innerHTML = "";
                const title = document.createElement('div');
                title.className = 'panel-title';
                title.textContent = '完整过程';
                stepsEl.appendChild(title);

                buildSteps(currentQ.question, currentQ.answer).forEach((step, i) => {
                    const row = document.createElement('div');
                    row.className = 'step-row';

                    const label = document.createElement('span');
                    label.className = 'step-title';
                    label.textContent = (i + 1) + '. ' + step.title;

                    const body = document.createElement('span');
                    body.className = 'step-body';

                    if (typeof katex !== 'undefined') {
                        try {
                            katex.render(step.expr, body, { displayMode: false, throwOnError: false });
                        } catch (err) {
                            body.textContent = step.expr;
                        }
                    } else {
                        body.textContent = step.expr;
                    }

                    row.appendChild(label);
                    row.appendChild(body);
                    stepsEl.appendChild(row);
                });
                stepsEl.hidden = false;
            }

            // 本题结束（已看到完整过程），等学生自己点「下一题」
            function enterResultMode() {
                isLocked = true;
                setSubmitKey('next', '下一题');
            }

            // 难度切换（放弃当前题，不计入记录）
            levelTabs.addEventListener("click", (e) => {
                const tab = e.target.closest('.level-tab');
                if (!tab) return;

                const newLevel = parseInt(tab.dataset.level);
                if (newLevel === currentQ.level) return;
                if (!confirm("切换难度将放弃当前题目（不计入记录），确认切换吗？")) return;

                localStorage.removeItem(STORAGE_KEY);
                loadQuestion(newLevel, true);
            });

            // 虚拟键盘
            document.getElementById("keyboard").addEventListener("click", (e) => {
                const btn = e.target.closest('.key');
                if (!btn) return;

                const val = btn.dataset.val;
                const action = btn.dataset.action;
                // 本题结束后只允许「下一题」
                if (isLocked && action !== 'next') return;

                fbEl.textContent = ""; // 隐藏上一次的反馈

                if (val) {
                    currentInput += val;
                } else if (action === "backspace") {
                    if (currentInput.match(/\^[23]$/)) {
                        currentInput = currentInput.slice(0, -2);
                    } else {
                        currentInput = currentInput.slice(0, -1);
                    }
                } else if (action === "hint") {
                    showHints();
                } else if (action === "giveup") {
                    // 放弃并查看答案
                    if (!confirm("查看答案将放弃本题，确认吗？")) return;

                    const beforeGiveUp = currentInput;
                    isLocked = true;
                    currentInput = currentQ.answer;
                    renderInput();

                    fbEl.textContent = "标准答案如上。3 秒后自动进入下一题...";
                    fbEl.style.color = '#EF4444';

                    reportAttempt('wrong', true, beforeGiveUp);

                    nextTimer = setTimeout(() => {
                        localStorage.removeItem(STORAGE_KEY);
                        loadQuestion(currentQ.level, true);
                    }, 3000);
                } else if (action === "submit") {
                    if (currentInput === "") return;

                    const result = evaluateAnswer(currentInput, currentQ.answer);
                    fbEl.style.color = result.status === 'correct' ? '#10B981' : (result.status === 'error' || result.status === 'wrong' ? '#EF4444' : '#F59E0B');

                    if (result.status === 'correct') {
                        fbEl.textContent = result.msg;
                        isLocked = true;
                        reportAttempt('correct', false, currentInput);

                        nextTimer = setTimeout(() => {
                            localStorage.removeItem(STORAGE_KEY);
                            loadQuestion(currentQ.level, true);
                        }, 1500);
                    } else if (result.status === 'wrong') {
                        wrongCount++;
                        if (wrongCount >= 2) {
                            // 同一题错了两次：给出完整过程，本题结束
                            showSteps();
                            fbEl.textContent = "这题错了两次，完整过程在下面，对照看看是哪一步出的问题。看完点「下一题」。";
                            enterResultMode();
                            reportAttempt('wrong', true, currentInput);
                        } else {
                            fbEl.textContent = result.msg + "（还有 1 次机会，再想想；卡住可以点「提示」）";
                        }
                    } else {
                        fbEl.textContent = result.msg;
                    }
                } else if (action === "next") {
                    localStorage.removeItem(STORAGE_KEY);
                    loadQuestion(currentQ.level, true);
                    return; // 已经换题，不再渲染旧输入
                }

                if (!isLocked) renderInput();
            });

            // ---------- 启动：先确认登录，再出题 ----------
            const me = await fetchMe();
            if (!me) {
                location.replace('index.html');
                return;
            }
            rememberUser(me);

            const logoutBtn = document.getElementById('logout');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async () => {
                    try {
                        await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
                    } catch (err) { /* 忽略，退出后照样回登录页 */ }
                    location.replace('index.html');
                });
            }

            loadQuestion(2);
        };
    </script>
</body>
